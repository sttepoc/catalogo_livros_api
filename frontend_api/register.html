<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .logo {
            font-size: 2.5rem;
            color: #0d6efd;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4">
                    <div class="text-center">
                        <div class="logo">
                            <i class="bi bi-book"></i> BookHub
                        </div>
                        <h2 class="mb-4">Criar conta</h2>
                    </div>
                    
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome completo</label>
                            <input type="text" class="form-control" id="nome" placeholder="Seu nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" placeholder="••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Cadastrar</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">Já tem uma conta? <a href="login.html">Faça login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/frontend_api/js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const res = await apiRequest('/auth/register', 'POST', { nome, email, senha });
            if (res.status === 201) {
                alert("Cadastro feito com sucesso! Faça login.");
                window.location.href = 'login.html';
            } else {
                alert(res.data.msg || "Erro ao cadastrar. Tente novamente.");
            }
        });
    </script>
</body>
</html>
